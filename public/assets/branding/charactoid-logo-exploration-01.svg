<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">CHARACTOID logo exploration</title>
  <desc id="desc">An open character core formed by an incomplete ring, a central eye-like core and four organized capability blocks.</desc>
  <rect width="1200" height="780" fill="#fff"/>
  <style>
    .label{font-family:Arial,'Helvetica Neue',sans-serif;fill:#182C46;letter-spacing:.18em}
    .sub{font-family:Arial,'Helvetica Neue',sans-serif;fill:#7a8b98;letter-spacing:.08em}
  </style>
  <g transform="translate(92 84)">
    <text class="sub" font-size="13" y="0">CHARACTOID / OPEN CHARACTER CORE</text>
    <text class="label" font-size="18" y="42">IDENTITY EXPLORATION 01</text>
  </g>

  <!-- Main symbol: open, centered, extensible -->
  <g transform="translate(300 218)">
    <!-- four capability nodes, deliberately organized rather than scattered -->
    <path d="M80 44 L151 4 L190 72 L118 112 Z" fill="#39C5BB"/>
    <path d="M310 74 L379 113 L342 183 L271 143 Z" fill="#DCEBF2"/>
    <path d="M265 302 L337 263 L376 332 L304 371 Z" fill="#E2DDF0"/>
    <path d="M39 265 L110 226 L149 295 L78 334 Z" fill="#182C46"/>
    <!-- open ring / outward gesture -->
    <path d="M108 95 A174 174 0 1 1 119 292" fill="none" stroke="#182C46" stroke-width="28" stroke-linecap="round"/>
    <path d="M134 116 A144 144 0 0 1 268 117" fill="none" stroke="#39C5BB" stroke-width="18" stroke-linecap="round"/>
    <!-- central character / attention core -->
    <circle cx="200" cy="200" r="67" fill="#fff" stroke="#182C46" stroke-width="12"/>
    <circle cx="200" cy="200" r="40" fill="#39C5BB"/>
    <circle cx="200" cy="200" r="17" fill="#182C46"/>
    <circle cx="194" cy="194" r="5" fill="#fff"/>
    <!-- small opening / speech impulse -->
    <path d="M271 174 C302 162 324 143 337 118" fill="none" stroke="#39C5BB" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g transform="translate(672 270)">
    <text class="label" font-size="43" font-weight="700" letter-spacing=".13em" y="0">CHARACTOID</text>
    <text class="sub" font-size="14" y="38">AN OPEN SYSTEM FOR LIVING CHARACTERS</text>
    <line x1="0" y1="82" x2="390" y2="82" stroke="#D8E2E8"/>
    <text class="sub" font-size="13" y="123">KNOWLEDGE  /  VOICE  /  TOOLS  /  PRESENCE</text>
    <text class="sub" font-size="13" y="160">ONE CORE · MANY CAPABILITIES · ALWAYS EXTENSIBLE</text>
  </g>

  <!-- small monochrome validation -->
  <g transform="translate(92 660)">
    <text class="sub" font-size="12">MONOCHROME TEST</text>
    <g transform="translate(154 -38) scale(.20)">
      <path d="M108 95 A174 174 0 1 1 119 292" fill="none" stroke="#111" stroke-width="28" stroke-linecap="round"/>
      <circle cx="200" cy="200" r="67" fill="#fff" stroke="#111" stroke-width="12"/>
      <circle cx="200" cy="200" r="40" fill="#111"/>
      <circle cx="200" cy="200" r="17" fill="#fff"/>
    </g>
  </g>
  <text x="1080" y="708" class="sub" font-size="12" text-anchor="end">CONCEPT / 2026</text>
</svg>
